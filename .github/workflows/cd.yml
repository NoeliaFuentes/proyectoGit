
name: CD

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

  push:
    branches:
      - main
    paths-ignore:
      - README.md

  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          persist-credentials: true

      - name: Actualizar version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BRANCH_NAME: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "Pull Request detectado. La version se actualizara al fusionar."
            exit 0
          fi

          if [ ! -f README.md ]; then
            echo "ERROR: No existe README.md"
            exit 1
          fi

          VERSION=$(grep -oE 'AppVersion-[0-9]+' README.md | head -n 1)

          if [ -z "$VERSION" ]; then
            echo "ERROR: No se encuentra AppVersion en README.md"
            exit 1
          fi

          NUMERO=${VERSION#AppVersion-}
          NUEVA_VERSION=$((NUMERO + 1))
          FECHA=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          sed -i "s/$VERSION/AppVersion-$NUEVA_VERSION/" README.md

          echo "Ultima actualizacion: $FECHA" >> README.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if ! git diff --cached --quiet; then
            git commit -m "Actualizar a AppVersion-$NUEVA_VERSION"
            git push origin "HEAD:$BRANCH_NAME"
          fi

  validate-prod:
    needs: bump-version
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Validar token de produccion
        shell: powershell
        env:
          PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:PROD_TOKEN)) {
            Write-Error "El secret PROD_TOKEN no esta configurado"
            exit 1
          }

          if ($env:LOCAL_PROD_TOKEN -eq $env:PROD_TOKEN) {
            Write-Output "Token de produccion correcto"
          }
          else {
            Write-Error "Los tokens de produccion no coinciden"
            exit 1
          }
