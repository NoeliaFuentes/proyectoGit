
name: CI

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Actualizar README
        shell: powershell
        env:
          FEATURE_NAME: ${{ github.head_ref }}
        run: |
          $linea = "Nueva feature: $env:FEATURE_NAME"

          if (!(Test-Path README.md)) {
            New-Item README.md -ItemType File | Out-Null
          }

          $contenido = Get-Content README.md -Raw

          if ($contenido -notlike "*$linea*") {
            Add-Content README.md $linea
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git diff --cached --quiet

          if ($LASTEXITCODE -ne 0) {
            git commit -m "Actualizar README con nueva feature"
            git push origin HEAD:$env:FEATURE_NAME
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

  validate-dev:
    needs: update-readme
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Validar token de desarrollo
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:DEV_TOKEN)) {
            Write-Error "DEV_TOKEN no esta configurado"
            exit 1
          }

          if ($env:LOCAL_DEV_TOKEN -eq $env:DEV_TOKEN) {
            Write-Output "Token de desarrollo correcto"
          }
          else {
            Write-Error "Los tokens no coinciden"
            exit 1
          }
