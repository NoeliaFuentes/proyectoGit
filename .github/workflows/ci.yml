
name: CI

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]

  push:
    branches:
      - develop
    paths-ignore:
      - README.md

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          persist-credentials: true

      - name: Actualizar README
        shell: bash
        env:
          FEATURE_NAME: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            LINEA="Añadida feature: $FEATURE_NAME"

            touch README.md

            if ! grep -Fxq "$LINEA" README.md; then
              echo "$LINEA" >> README.md
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add README.md

            if ! git diff --cached --quiet; then
              git commit -m "Actualizar README con nueva feature"
              git push origin "HEAD:$FEATURE_NAME"
            fi
          else
            echo "Evento $EVENT_NAME: no hay nueva feature que registrar."
          fi

  validate-dev:
    needs: update-readme
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Validar token de desarrollo
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:DEV_TOKEN)) {
            Write-Error "DEV_TOKEN no esta configurado"
            exit 1
          }

          if ($env:LOCAL_DEV_TOKEN -eq $env:DEV_TOKEN) {
            Write-Output "Token de desarrollo correcto"
          }
          else {
            Write-Error "Los tokens no coinciden"
            exit 1
          }
