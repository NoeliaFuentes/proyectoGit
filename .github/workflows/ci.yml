
name: CI

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: self-hosted

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Actualizar README
        shell: bash
        run: |
          touch README.md
          echo "Nueva feature: ${{ github.head_ref }}" >> README.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "Actualizar README con nueva feature" || true
          git push

  validate-dev:
    needs: update-readme
    runs-on: self-hosted

    steps:
      - name: Validar token de desarrollo
        shell: bash
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if [ "$LOCAL_DEV_TOKEN" = "$DEV_TOKEN" ]; then
            echo "Token de desarrollo correcto"
          else
            echo "ERROR: Los tokens no coinciden"
            exit 1
          fi
